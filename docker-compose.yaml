# FieldPilot AI — platform infrastructure.
# PostgreSQL stores every event + alerts/rules/notifications; Redis is the event bus
# and the trigger-engine hot cache. Qdrant + Ollama serve the RAG/RFI milestone (M3).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fieldpilot
      POSTGRES_PASSWORD: fieldpilot
      POSTGRES_DB: fieldpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  ollamadata:
